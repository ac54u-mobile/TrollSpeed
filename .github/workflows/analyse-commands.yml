name: Theos - Build Packages

on:
  push:
    branches:
      - main

env:
  THEOS: ''
  GIT_TAG: ''
  GIT_COMMIT: ''
  XCODE_VERSION: '15.4'

jobs:
  build:
    name: Build and generate compilation database
    runs-on: macos-14

    steps:
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Homebrew dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install dpkg make libplist openssl@3 ldid-procursus
          echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Checkout roothide/theos
        uses: actions/checkout@v5
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Add THEOS environment variables
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Checkout theos/sdks
        uses: actions/checkout@v5
        with:
          repository: theos/sdks
          ref: master
          path: ${{ env.THEOS }}/sdks

      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: TrollSpeed
          submodules: recursive

      - name: Setup build environment
        run: |
          echo "Available SDKs: $(find $THEOS/sdks -name "*.sdk" -maxdepth 1 -print)"
          echo "FINALPACKAGE=1" >> $GITHUB_ENV
          cd $GITHUB_WORKSPACE/TrollSpeed
          git fetch --tags
          echo "GIT_TAG=$(git describe --tags --always --abbrev=0)" >> $GITHUB_ENV

      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE/TrollSpeed
          ./gen-control.sh

          build_package() {
            local label="$1"
            shift
            if ! "$@" >"${label}.log" 2>&1; then
              tail -80 "${label}.log"
              summary=$(tail -25 "${label}.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error title=${label} package build failed::${summary}"
              return 1
            fi
            tail -30 "${label}.log"
          }

          build_package rootless env THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 gmake clean package
          build_package rootful env FINALPACKAGE=1 gmake clean package
