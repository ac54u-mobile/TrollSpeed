name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*"
      - "v*.*.*"

env:
  THEOS: ''
  PKG_VERSION: ''
  XCODE_VERSION: '15.4'

jobs:
  build:
    name: Build and upload release package for TrollStore
    runs-on: macos-14

    steps:
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Homebrew dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install dpkg make libplist openssl@3 ldid-procursus
          echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Checkout roothide/theos
        uses: actions/checkout@v5
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Add THEOS environment variables
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Checkout theos/sdks
        uses: actions/checkout@v5
        with:
          repository: theos/sdks
          ref: master
          path: ${{ env.THEOS }}/sdks

      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: TrollSpeed
          submodules: recursive

      - name: Setup build environment
        run: |
          echo "Available SDKs: $(find $THEOS/sdks -name "*.sdk" -maxdepth 1 -print)"
          echo "FINALPACKAGE=1" >> $GITHUB_ENV
          cd $GITHUB_WORKSPACE/TrollSpeed
          echo "PKG_VERSION=$(./get-version.sh)" >> $GITHUB_ENV

      - name: Build package
        shell: bash
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE/TrollSpeed
          ./gen-control.sh

          run_logged() {
            local label="$1"
            shift
            if ! "$@" >"${label}.log" 2>&1; then
              tail -100 "${label}.log"
              summary=$(tail -30 "${label}.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error title=${label} build failed::${summary}"
              return 1
            fi
            tail -30 "${label}.log"
          }

          run_logged appintents ./build.sh
          run_logged roothide env THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 gmake clean package
          run_logged rootless env THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 gmake clean package
          run_logged rootful env FINALPACKAGE=1 gmake clean package

      - name: Collect symbols
        run: |
          cd $GITHUB_WORKSPACE/TrollSpeed
          find .theos/obj -name "*.dSYM" -print | zip -r packages/TrollSpeed_${{ env.PKG_VERSION }}_symbols.zip -@

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrollSpeed_${{ env.PKG_VERSION }}
          path: |
            TrollSpeed/packages/TrollSpeed_*.tipa
            TrollSpeed/packages/TrollSpeed+AppIntents16_*.tipa
            TrollSpeed/packages/ch.xxtou.hudapp.jb_*.deb

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: TrollSpeed_${{ env.PKG_VERSION }}_symbols
          path: |
            TrollSpeed/packages/TrollSpeed_${{ env.PKG_VERSION }}_symbols.zip

      - name: Upload release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.PKG_VERSION }}
          body_path: TrollSpeed/CHANGELOG.md
          files: |
            TrollSpeed/packages/TrollSpeed_*.tipa
            TrollSpeed/packages/TrollSpeed+AppIntents16_*.tipa
            TrollSpeed/packages/ch.xxtou.hudapp.jb_*.deb
